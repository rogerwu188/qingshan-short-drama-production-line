name: portable-core

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m qingshan_engine.cli doctor --profile core
      - run: python tools/run_portable_ci.py
      - run: python -m unittest tools.tests.test_episode_prompt_batch_gate tools.tests.test_episode_prompt_batch_paid_boundary
      - run: python -m unittest tools.tests.test_preproduction_prompt_compile
      - run: python tools/deployment_code_integrity.py
      - run: python -m unittest tools.tests.test_knowledge_registry
      - run: python -m qingshan_engine.cli knowledge --validate
