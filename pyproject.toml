[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qingshan-short-drama-engine"
version = "0.3.0"
description = "MIT-licensed end-to-end AI film and short-drama production engine"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Roger Wu"}]
keywords = ["ai-video", "short-drama", "film-production", "seedance", "minimax-h3"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]
dependencies = []

[project.optional-dependencies]
media = [
  "Pillow>=10,<12",
  "imagehash>=4.3,<5",
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8,<5",
  "soundfile>=0.12,<1",
]
asr = ["faster-whisper>=1,<2"]
cloud = ["boto3>=1.34,<2", "cryptography>=42,<46", "requests>=2.31,<3"]
dev = ["jsonschema>=4.21,<5", "pytest>=8,<9"]
all = [
  "Pillow>=10,<12",
  "imagehash>=4.3,<5",
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8,<5",
  "soundfile>=0.12,<1",
  "faster-whisper>=1,<2",
  "boto3>=1.34,<2",
  "cryptography>=42,<46",
  "requests>=2.31,<3",
  "jsonschema>=4.21,<5",
  "pytest>=8,<9",
]

[project.scripts]
qingshan = "qingshan_engine.cli:main"

[project.urls]
Homepage = "https://github.com/rogerwu188/qingshan-short-drama-production-line"
Repository = "https://github.com/rogerwu188/qingshan-short-drama-production-line"
Issues = "https://github.com/rogerwu188/qingshan-short-drama-production-line/issues"

[tool.setuptools]
packages = ["qingshan_engine"]
